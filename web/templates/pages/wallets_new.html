{{ define "content" }}
<div class="rounded-lg border border-slate-200 bg-white p-8 max-w-xl mx-auto">
    <h1 class="text-2xl font-semibold text-slate-900 mb-6">Nouveau porte-monnaie</h1>

    <form action="/wallets" method="POST" class="space-y-4">
        <div>
            <label for="name" class="block text-sm font-medium text-slate-700 mb-1">
                Nom du porte-monnaie
            </label>
            <input type="text" id="name" name="name" required
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-slate-900 focus:border-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-900"
                   placeholder="Ex: Vacances en Bretagne">
        </div>

        <div class="pt-2">
            <button type="submit"
                    class="rounded bg-slate-900 px-4 py-2 text-white hover:bg-slate-700">
                Créer le porte-monnaie
            </button>
            <a href="/" class="ml-4 text-sm text-slate-500 hover:underline">Annuler</a>
        </div>
    </form>
</div>
{{ end }}
