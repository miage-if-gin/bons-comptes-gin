{{ define "content" }}
<div class="rounded-lg border border-slate-200 bg-white p-8">
    <h1 class="text-2xl font-semibold">Partagez vos dépenses sans vous fâcher</h1>
    <p class="mt-3 text-slate-600">
        Créez un porte-monnaie commun, invitez vos amis, déclarez vos dépenses.
        À la clôture, l'application calcule qui doit combien à qui.
    </p>
    {{ if not .CurrentAccount }}
    <a href="/register"
       class="mt-6 inline-block rounded bg-slate-900 px-4 py-2 text-white hover:bg-slate-700">
        Commencer
    </a>
    {{ end }}
</div>
{{ end }}
