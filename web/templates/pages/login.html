{{ define "content" }}
<div class="mx-auto max-w-md rounded-lg border border-slate-200 bg-white p-8">
    <h1 class="text-xl font-semibold">Connexion</h1>

    {{ if .Erreur }}
    <p class="mt-4 rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800">
        {{ .Erreur }}
    </p>
    {{ end }}

    <form method="post" action="/login" class="mt-6 space-y-4">
        <div>
            <label for="email" class="block text-sm font-medium">Email</label>
            <input type="email" id="email" name="email" required autofocus
                   value="{{ .Email }}"
                   class="mt-1 w-full rounded border border-slate-300 px-3 py-2">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium">Mot de passe</label>
            <input type="password" id="password" name="password" required
                   class="mt-1 w-full rounded border border-slate-300 px-3 py-2">
        </div>

        <button type="submit"
                class="w-full rounded bg-slate-900 px-4 py-2 text-white hover:bg-slate-700">
            Se connecter
        </button>
    </form>

    <p class="mt-6 text-sm text-slate-600">
        Pas encore de compte ? <a href="/register" class="underline">Créer un compte</a>
    </p>
</div>
{{ end }}
