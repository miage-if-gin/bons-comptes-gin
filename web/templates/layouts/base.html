{{ define "base" }}
<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }} — Les bons comptes</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.4/htmx.min.js"></script>
</head>
<body class="h-full bg-slate-50 text-slate-900 antialiased">

<header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-4xl items-center justify-between px-4 py-4">
        <a href="/" class="text-lg font-semibold">Les bons comptes</a>
        <div class="flex items-center gap-4 text-sm">
            {{ if .CurrentAccount }}
            <span class="text-slate-500">{{ .CurrentAccount.DisplayName }}</span>
            <a href="/wallets" class="hover:underline">Mes porte-monnaies</a>
            <form method="post" action="/logout" class="inline">
                <button type="submit" class="hover:underline">Déconnexion</button>
            </form>
            {{ else }}
            <a href="/login" class="hover:underline">Connexion</a>
            <a href="/register"
               class="rounded bg-slate-900 px-3 py-1.5 text-white hover:bg-slate-700">
                Créer un compte
            </a>
            {{ end }}
        </div>
    </nav>
</header>

<main class="mx-auto max-w-4xl px-4 py-8">
    {{ if .Flash }}
    <div class="mb-6 rounded border border-amber-200 bg-amber-50 px-4 py-3 text-sm">
        {{ .Flash }}
    </div>
    {{ end }}

    {{ template "content" . }}
</main>

</body>
</html>
{{ end }}
