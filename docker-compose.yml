services:
  postgres:
    image: postgres:17-alpine
    container_name: bons-comptes-db
    environment:
      POSTGRES_USER: bonscomptes
      POSTGRES_PASSWORD: bonscomptes
      POSTGRES_DB: bonscomptes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonscomptes -d bonscomptes"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:5
    container_name: bons-comptes-adminer
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: