name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bonscomptes
          POSTGRES_PASSWORD: bonscomptes
          POSTGRES_DB: bonscomptes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://bonscomptes:bonscomptes@localhost:5432/bonscomptes_test?sslmode=disable
      SESSION_SECRET: ci_secret_non_sensible_0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Vérifier le formatage
        run: |
          non_formate=$(gofmt -l .)
          if [ -n "$non_formate" ]; then
            echo "Fichiers non formatés :"
            echo "$non_formate"
            exit 1
          fi

      - name: Analyse statique
        run: go vet ./...

      - name: Compilation
        run: go build ./...

      - name: Tests
        run: go test ./... -race -cover